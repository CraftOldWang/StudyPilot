services:
  mineru:
    build: .
    image: studypilot-mineru:2.5.4
    ports:
      - "127.0.0.1:18001:8000"
    environment:
      MINERU_MIN_BATCH_INFERENCE_SIZE: "${MINERU_MIN_BATCH_INFERENCE_SIZE:-1}"
      STUDYPILOT_MINERU_MFR_BATCH_SIZE: "${STUDYPILOT_MINERU_MFR_BATCH_SIZE:-1}"
      STUDYPILOT_MINERU_PAGE_WINDOW: "${STUDYPILOT_MINERU_PAGE_WINDOW:-4}"
    volumes:
      - models:/models
volumes:
  models:
    external: true
    name: ${MINERU_MODELS_VOLUME:-know-engine_mineru-models}
