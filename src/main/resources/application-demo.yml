spring:
  config:
    import: []
  datasource:
    url: jdbc:mysql://mysql:3306/study_agent_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: study
    password: ${MYSQL_PASSWORD}
  flyway:
    connect-retries: 60
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

rocketmq:
  name-server: rocketmq-namesrv:9876
  producer:
    group: study-agent-demo-producer

study-agent:
  demo:
    enabled: true
    public-origin: https://${DOMAIN}
    writes-per-minute: 60
  agentscope:
    workspace: /data/agentscope
    model:
      primary-model-id: deepseek:${study-agent.ai.chat.model}
  ai:
    chat:
      model: ${CHAT_MODEL:deepseek-v4-flash}
      api-key: ${DEEPSEEK_API_KEY}
    embedding:
      model: ${EMBEDDING_MODEL:qwen3.7-text-embedding}
      api-key: ${AI_DASHSCOPE_API_KEY}
  model-usage:
    ledger: /data/model-calls.jsonl
    max-calls: ${MODEL_MAX_CALLS:500}
  embedding-usage:
    ledger: /data/embedding-calls.jsonl
  upload:
    max-file-bytes: 52428800
    max-chunk-bytes: 8388608
  object-storage:
    endpoint: http://rustfs:9000
    access-key: ${RUSTFS_ACCESS_KEY}
    secret-key: ${RUSTFS_SECRET_KEY}
    bucket: study-agent-demo
  elasticsearch:
    endpoint: http://elasticsearch:9200
    physical-index: demo-qwen37-1024-v1
    read-alias: demo-qwen37-1024-read
    write-alias: demo-qwen37-1024-write
  rocketmq:
    document-topic: study-agent-demo-document
    document-consumer-group: study-agent-demo-document-consumer
  canal:
    enabled: false
