server:
  port: 8080

spring:
  profiles:
    default: local
  config:
    import: optional:file:./some_apiKey[.properties]
  application:
    name: study-agent
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1100MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/study_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: study
    password: study123
  data:
    redis:
      host: localhost
      port: 6380
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

rocketmq:
  name-server: localhost:9876
  producer:
    group: study-agent-producer

study-agent:
  ingest:
    mineru:
      enabled: ${STUDY_AGENT_INGEST_MINERU_ENABLED:false}
      endpoint: "${STUDY_AGENT_INGEST_MINERU_ENDPOINT:http://127.0.0.1:18001/file_parse}"
      timeout: ${STUDY_AGENT_INGEST_MINERU_TIMEOUT:30m}
      vision:
        enabled: ${STUDY_AGENT_INGEST_VISION_ENABLED:false}
        endpoint: "${STUDY_AGENT_INGEST_VISION_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}"
        model: ${STUDY_AGENT_INGEST_VISION_MODEL:qwen3-vl-plus}
        api-key: ${STUDY_AGENT_INGEST_VISION_API_KEY:${AI_DASHSCOPE_API_KEY:${bailian_for_embedding:}}}
        timeout: ${STUDY_AGENT_INGEST_VISION_TIMEOUT:60s}
        min-side-permille: ${STUDY_AGENT_INGEST_VISION_MIN_SIDE_PERMILLE:35}
        max-tokens: ${STUDY_AGENT_INGEST_VISION_MAX_TOKENS:512}
  agentscope:
    workspace: ${AGENTSCOPE_WORKSPACE:${user.dir}/.agentscope/workspace}
    model:
      primary-model-id: deepseek:deepseek-chat
      max-retries: 1
      dashscope:
        api-key: ${study-agent.ai.embedding.api-key}
        base-url: "${study-agent.ai.embedding.base-url}"
      deepseek:
        api-key: ${study-agent.ai.chat.api-key}
        base-url: "${study-agent.ai.chat.base-url}"
        max-tokens: ${study-agent.ai.chat.max-tokens}
        thinking-enabled: ${DEEPSEEK_THINKING_ENABLED:false}
        temperature: ${study-agent.ai.chat.temperature}
  object-storage:
    endpoint: "${S3_ENDPOINT:http://localhost:9000}"
    access-key: study
    secret-key: study123456
    bucket: study-agent
    region: us-east-1
    path-style-access: true
  elasticsearch:
    endpoint: http://localhost:9200
    physical-index: chunks-v1
    read-alias: chunks-v1-read
    write-alias: chunks-v1-write
    vector-dimensions: 1024
  rag:
    top-k: 6
    chunk-size: 800
    chunk-overlap: 80
    parent-chunk-size: 2400
    parent-chunk-overlap: 0
    chunk-strategy: STRUCTURED
    bm25-candidate-size: 30
    vector-candidate-size: 30
    rrf-k: 60
    context-max-tokens: 4096
  ai:
    embedding:
      provider: dashscope
      model: text-embedding-v3
      dimensions: 1024
      api-key: ${AI_DASHSCOPE_API_KEY:${bailian_for_embedding:}}
      base-url: "${AI_DASHSCOPE_BASE_URL:${bailian_openai_compatible:https://dashscope.aliyuncs.com/api/v1}}"
    chat:
      provider: deepseek
      model: deepseek-chat
      api-key: ${DEEPSEEK_API_KEY:${new_deepseek_apiKey:}}
      base-url: "${DEEPSEEK_BASE_URL:https://api.deepseek.com}"
      temperature: 0.2
      max-tokens: 1800
  rocketmq:
    document-topic: study-agent-document
    document-consumer-group: study-agent-document-consumer
  canal:
    enabled: true
    host: localhost
    port: 11111
    destination: study_agent
    username:
    password:
    subscribe-regex: 'study_agent\.documents'
    batch-size: 100
    empty-sleep-millis: 1000
